<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Radar de Compétences</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px; text-align: center; background: transparent; }
    h3 { margin: 0 0 10px 0; font-size: 14px; color: #2c3e50; }
    #radar-container { width: 100%; max-width: 320px; margin: 0 auto; }
    svg { width: 100%; height: auto; overflow: visible; }
    .grid-line { stroke: #e0e0e0; stroke-width: 1; fill: none; }
    .axis { stroke: #cccccc; stroke-width: 1; }
    .radar-poly { fill: rgba(52, 152, 219, 0.35); stroke: #2980b9; stroke-width: 2.5; }
    .radar-point { fill: #2980b9; r: 3.5; }
    .label { font-size: 9px; font-weight: 600; fill: #333; text-anchor: middle; }
  </style>
</head>
<body>

<h3 id="joueur-titre">Profil Joueur</h3>
<div id="radar-container">
  <svg id="radarSVG" viewBox="0 0 300 300"></svg>
</div>

<script>
  const svg = document.getElementById('radarSVG');
  const center = 150, radius = 90, maxVal = 5;

  grist.ready({ requiredAccess: 'read' });

  grist.onRecord(async function(record) {
    if (!record || !record.id) return;

    const nom = record.Nom_prenom || record.Nom || record.Prenom || "Joueur";
    document.getElementById('joueur-titre').innerText = "Radar : " + nom;

    try {
      const [evalsData, compsData] = await Promise.all([
        grist.docApi.fetchTable('Evaluations'),
        grist.docApi.fetchTable('Competences')
      ]);

      // Mappage compétence -> Groupe avec nettoyage des espaces (.trim())
      const compGroupMap = {};
      if (compsData && compsData.id) {
        for (let i = 0; i < compsData.id.length; i++) {
          const compId = compsData.id[i];
          let groupeVal = compsData.REG1_competences_transverses ? compsData.REG1_competences_transverses[i] : 
                         (compsData.Type ? compsData.Type[i] : 
                         (compsData.Groupe ? compsData.Groupe[i] : "Général"));
          
          compGroupMap[compId] = groupeVal ? String(groupeVal).trim() : "Autre";
        }
      }

      // Calcul des moyennes par groupe
      const groupeTotaux = {};
      const groupeCompte = {};

      if (evalsData && evalsData.id) {
        const colJoueur = evalsData.Joueur !== undefined ? 'Joueur' : 'joueur';
        const colNote = evalsData.note !== undefined ? 'note' : 'Note';
        const colComp = evalsData.Competence !== undefined ? 'Competence' : 'competence';

        for (let i = 0; i < evalsData.id.length; i++) {
          const jId = evalsData[colJoueur][i];
          const noteVal = evalsData[colNote][i];
          const cId = evalsData[colComp][i];
          const note = parseFloat(noteVal);

          if (jId === record.id && !isNaN(note) && note > 0) {
            const grp = compGroupMap[cId] || "Autre";
            groupeTotaux[grp] = (groupeTotaux[grp] || 0) + note;
            groupeCompte[grp] = (groupeCompte[grp] || 0) + 1;
          }
        }
      }

      const categories = Object.keys(groupeTotaux);
      console.log("Groupes détectés pour ce joueur :", categories);
      
      const scores = categories.map(g => (groupeTotaux[g] / groupeCompte[g]));

      drawRadar(categories, scores);

    } catch (err) {
      console.error("Erreur Grist :", err);
    }
  });

  function drawRadar(labels, values) {
    svg.innerHTML = '';
    
    if (labels.length < 3) {
      svg.innerHTML = `<text x="${center}" y="${center}" text-anchor="middle" fill="#c0392b" font-size="10">
        Groupes détectés : ${labels.join(', ')} (${labels.length}/3 min)
      </text>`;
      return;
    }

    const totalAxes = labels.length;
    const angleStep = (Math.PI * 2) / totalAxes;

    // Toile de fond
    for (let level = 1; level <= maxVal; level++) {
      const r = (radius / maxVal) * level;
      let points = [];
      for (let i = 0; i < totalAxes; i++) {
        const angle = i * angleStep - Math.PI / 2;
        points.push(`${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`);
      }
      const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      poly.setAttribute("points", points.join(" "));
      poly.setAttribute("class", "grid-line");
      svg.appendChild(poly);
    }

    // Axes et étiquettes
    for (let i = 0; i < totalAxes; i++) {
      const angle = i * angleStep - Math.PI / 2;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", center); line.setAttribute("y1", center);
      line.setAttribute("x2", center + radius * Math.cos(angle));
      line.setAttribute("y2", center + radius * Math.sin(angle));
      line.setAttribute("class", "axis");
      svg.appendChild(line);

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      const lr = radius + 22;
      text.setAttribute("x", center + lr * Math.cos(angle));
      text.setAttribute("y", center + lr * Math.sin(angle) + 3);
      text.setAttribute("class", "label");
      text.textContent = labels[i] + ` (${values[i].toFixed(1)})`;
      svg.appendChild(text);
    }

    // Polygone joueur
    let dataPoints = [];
    for (let i = 0; i < totalAxes; i++) {
      const angle = i * angleStep - Math.PI / 2;
      const vr = (radius / maxVal) * Math.min(values[i], maxVal);
      dataPoints.push(`${center + vr * Math.cos(angle)},${center + vr * Math.sin(angle)}`);
    }

    const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    poly.setAttribute("points", dataPoints.join(" "));
    poly.setAttribute("class", "radar-poly");
    svg.appendChild(poly);

    dataPoints.forEach(pt => {
      const [cx, cy] = pt.split(',');
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", cx); c.setAttribute("cy", cy);
      c.setAttribute("class", "radar-point");
      svg.appendChild(c);
    });
  }
</script>

</body>
</html>
