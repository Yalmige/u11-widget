<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Radar de Compétences - Comparatif</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 5px; text-align: center; background: transparent; }
    h3 { margin: 0 0 2px 0; font-size: 13px; color: #2c3e50; }
    #legend { font-size: 10px; margin-bottom: 5px; color: #555; }
    .player-legend { color: #2980b9; font-weight: bold; }
    .team-legend { color: #7f8c8d; font-weight: bold; }
    #radar-container { width: 100%; max-width: 300px; margin: 0 auto; }
    svg { width: 100%; height: auto; overflow: visible; }
    .grid-line { stroke: #e0e0e0; stroke-width: 1; fill: none; }
    .axis { stroke: #cccccc; stroke-width: 1; }
    
    /* Style du joueur (Bleu) */
    .radar-poly { fill: rgba(52, 152, 219, 0.3); stroke: #2980b9; stroke-width: 2.5; }
    .radar-point { fill: #2980b9; r: 3.5; }
    
    /* Style de l'équipe (Gris / Pointillé) */
    .team-poly { fill: rgba(127, 140, 141, 0.15); stroke: #7f8c8d; stroke-width: 1.5; stroke-dasharray: 4,4; }
    
    .label { font-size: 9px; font-weight: 600; fill: #333; text-anchor: middle; }
  </style>
</head>
<body>

<h3 id="joueur-titre">Profil Joueur</h3>
<div id="legend">
  <span class="player-legend">■ Joueur</span> &nbsp;|&nbsp; <span class="team-legend">╍╍ Moyenne Équipe</span>
</div>
<div id="radar-container">
  <svg id="radarSVG" viewBox="0 0 300 300"></svg>
</div>

<script>
  const svg = document.getElementById('radarSVG');
  const center = 150, radius = 85, maxVal = 5;

  grist.ready({ requiredAccess: 'read' });

  grist.onRecord(async function(record) {
    if (!record || !record.id) return;

    const nom = record.Nom_prenom || record.Nom || record.Prenom || "Joueur";
    document.getElementById('joueur-titre').innerText = "Radar : " + nom;

    try {
      const [evalsData, compsData] = await Promise.all([
        grist.docApi.fetchTable('Evaluations'),
        grist.docApi.fetchTable('Competences')
      ]);

      // Mappage compétence -> Groupe
      const compGroupMap = {};
      if (compsData && compsData.id) {
        for (let i = 0; i < compsData.id.length; i++) {
          const compId = compsData.id[i];
          let groupeVal = compsData.REG1_competences_transverses ? compsData.REG1_competences_transverses[i] : 
                         (compsData.Type ? compsData.Type[i] : 
                         (compsData.Groupe ? compsData.Groupe[i] : "Général"));
          
          compGroupMap[compId] = groupeVal ? String(groupeVal).trim() : "Autre";
        }
      }

      if (!evalsData || !evalsData.id) return;

      const colJoueur = evalsData.Joueur !== undefined ? 'Joueur' : 'joueur';
      const colNote = evalsData.note !== undefined ? 'note' : 'Note';
      const colComp = evalsData.Competence !== undefined ? 'Competence' : 'competence';

      // 1. Calcul des moyennes du JOUEUR par groupe
      const playerTotaux = {};
      const playerCompte = {};

      // 2. Calcul des moyennes de l'ÉQUIPE ENTIÈRE par groupe
      const teamTotaux = {};
      const teamCompte = {};

      for (let i = 0; i < evalsData.id.length; i++) {
        const jId = evalsData[colJoueur][i];
        const noteVal = evalsData[colNote][i];
        const cId = evalsData[colComp][i];
        const note = parseFloat(noteVal);

        if (!isNaN(note) && note > 0) {
          const grp = compGroupMap[cId] || "Autre";

          // Pour l'équipe globale
          teamTotaux[grp] = (teamTotaux[grp] || 0) + note;
          teamCompte[grp] = (teamCompte[grp] || 0) + 1;

          // Pour le joueur sélectionné
          if (jId === record.id) {
            playerTotaux[grp] = (playerTotaux[grp] || 0) + note;
            playerCompte[grp] = (playerCompte[grp] || 0) + 1;
          }
        }
      }

      const categories = Object.keys(teamTotaux);
      
      const playerScores = categories.map(g => playerCompte[g] ? (playerTotaux[g] / playerCompte[g]) : 0);
      const teamScores = categories.map(g => teamCompte[g] ? (teamTotaux[g] / teamCompte[g]) : 0);

      drawRadar(categories, playerScores, teamScores);

    } catch (err) {
      console.error("Erreur Grist :", err);
    }
  });

  function drawRadar(labels, playerValues, teamValues) {
    svg.innerHTML = '';
    
    if (labels.length < 3) {
      svg.innerHTML = `<text x="${center}" y="${center}" text-anchor="middle" fill="#c0392b" font-size="10">
        Nécessite au moins 3 groupes (${labels.length}/3)
      </text>`;
      return;
    }

    const totalAxes = labels.length;
    const angleStep = (Math.PI * 2) / totalAxes;

    // Toile de fond (cercles/polygones concentriques)
    for (let level = 1; level <= maxVal; level++) {
      const r = (radius / maxVal) * level;
      let points = [];
      for (let i = 0; i < totalAxes; i++) {
        const angle = i * angleStep - Math.PI / 2;
        points.push(`${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`);
      }
      const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      poly.setAttribute("points", points.join(" "));
      poly.setAttribute("class", "grid-line");
      svg.appendChild(poly);
    }

    // Axes et étiquettes
    for (let i = 0; i < totalAxes; i++) {
      const angle = i * angleStep - Math.PI / 2;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", center); line.setAttribute("y1", center);
      line.setAttribute("x2", center + radius * Math.cos(angle));
      line.setAttribute("y2", center + radius * Math.sin(angle));
      line.setAttribute("class", "axis");
      svg.appendChild(line);

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      const lr = radius + 25;
      text.setAttribute("x", center + lr * Math.cos(angle));
      text.setAttribute("y", center + lr * Math.sin(angle) + 3);
      text.setAttribute("class", "label");
      text.textContent = labels[i] + ` (${playerValues[i].toFixed(1)})`;
      svg.appendChild(text);
    }

    // 1. Tracé de la moyenne ÉQUIPE (en arrière-plan, pointillé gris)
    let teamPoints = [];
    for (let i = 0; i < totalAxes; i++) {
      const angle = i * angleStep - Math.PI / 2;
      const vr = (radius / maxVal) * Math.min(teamValues[i], maxVal);
      teamPoints.push(`${center + vr * Math.cos(angle)},${center + vr * Math.sin(angle)}`);
    }
    const teamPoly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    teamPoly.setAttribute("points", teamPoints.join(" "));
    teamPoly.setAttribute("class", "team-poly");
    svg.appendChild(teamPoly);

    // 2. Tracé du JOUEUR (en premier plan, plein bleu)
    let playerPoints = [];
    for (let i = 0; i < totalAxes; i++) {
      const angle = i * angleStep - Math.PI / 2;
      const vr = (radius / maxVal) * Math.min(playerValues[i], maxVal);
      playerPoints.push(`${center + vr * Math.cos(angle)},${center + vr * Math.sin(angle)}`);
    }
    const playerPoly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    playerPoly.setAttribute("points", playerPoints.join(" "));
    playerPoly.setAttribute("class", "radar-poly");
    svg.appendChild(playerPoly);

    // Points du joueur
    playerPoints.forEach(pt => {
      const [cx, cy] = pt.split(',');
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", cx); c.setAttribute("cy", cy);
      c.setAttribute("class", "radar-point");
      svg.appendChild(c);
    });
  }
</script>

</body>
</html>
