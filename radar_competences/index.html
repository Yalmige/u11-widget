<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Radar des compétences</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: transparent;
    }
    #chart-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }
    h3 {
      text-align: center;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>

<h3 id="joueur-titre">Radar des compétences</h3>
<div id="chart-container">
  <canvas id="radarChart"></canvas>
</div>

<script>
  let radarChart = null;

  function initChart() {
    const ctx = document.getElementById('radarChart').getContext('2d');
    radarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: [],
        datasets: [{
          label: 'Moyenne / 5',
          data: [],
          backgroundColor: 'rgba(54, 162, 235, 0.2)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 2,
          pointBackgroundColor: 'rgba(54, 162, 235, 1)'
        }]
      },
      options: {
        responsive: true,
        scales: {
          r: {
            min: 0,
            max: 5,
            ticks: { stepSize: 1 }
          }
        }
      }
    });
  }

  initChart();
  grist.ready({ requiredAccess: 'read' });

  grist.onRecord(async function(record) {
    if (!record || !record.id) return;

    // Récupération sécurisée du nom du joueur
    const nomJoueur = record.Nom_prenom || record.Nom || "Joueur";
    document.getElementById('joueur-titre').innerText = "Profil : " + nomJoueur;

    try {
      const [evalsData, compsData] = await Promise.all([
        grist.docApi.fetchTable('Evaluations'),
        grist.docApi.fetchTable('Competences')
      ]);

      // Indexation des groupes par ID de compétence
      const compGroupMap = {};
      if (compsData && compsData.id) {
        for (let i = 0; i < compsData.id.length; i++) {
          const compId = compsData.id[i];
          const groupe = (compsData.Groupe && compsData.Groupe[i]) ? compsData.Groupe[i] : "Général";
          compGroupMap[compId] = groupe;
        }
      }

      // Calcul des moyennes par groupe pour le joueur actuel
      const groupeTotaux = {};
      const groupeCompte = {};

      if (evalsData && evalsData.id) {
        for (let i = 0; i < evalsData.id.length; i++) {
          const joueurId = evalsData.Joueur[i];
          const noteVal = evalsData.note ? evalsData.note[i] : (evalsData.Note ? evalsData.Note[i] : null);
          const compId = evalsData.Competence[i];
          const note = parseFloat(noteVal);

          if (joueurId === record.id && !isNaN(note) && note > 0) {
            const groupe = compGroupMap[compId] || "Général";
            if (!groupeTotaux[groupe]) {
              groupeTotaux[groupe] = 0;
              groupeCompte[groupe] = 0;
            }
            groupeTotaux[groupe] += note;
            groupeCompte[groupe] += 1;
          }
        }
      }

      const labels = Object.keys(groupeTotaux);
      const data = labels.map(g => (groupeTotaux[g] / groupeCompte[g]).toFixed(1));

      // Mise à jour du graphique
      radarChart.data.labels = labels.length > 0 ? labels : ["Aucune donnée"];
      radarChart.data.datasets[0].data = labels.length > 0 ? data : [0];
      radarChart.update();

    } catch (err) {
      console.error("Erreur de chargement des tables Grist :", err);
    }
  });
</script>

</body>
</html>
