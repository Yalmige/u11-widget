        <div class="form-group">
            <label for="select-L'image est très claire : le widget parvient bien à lire la table `Joueurs` (puisqu'il trouve 17 enregistrements), mais il n'arrive pas à extraire le libellé du nom et retombe sur le mécanisme de secours `"Joueur #" + j.id`[cite: 2].

Cela se produit généralement pour deux raisons principales avec l'API Grist :
1. **Les colonnes de noms sont des colonnes de type Formule / Référence** (ou ont des identifiants internes comme `Nom_du_joueur` distincts de l'étiquette affichée).
2. **Le format renvoyé par `fetchTable`** nécessite de passer par les fonctions d'assistance Grist pour résoudre les colonnes d'affichage.

---

### Solution : Utilisation de `grist.docApi.fetchSelectedTable()` ou ciblage direct des champs

Voici la mise à jour de la fonction `initialiserApplication()`. Elle force la récupération des colonnes visibles et combine le prénom et le nom si les deux colonnes existent dans ta table `Joueurs` :

```javascript
        // Chargement initial des joueurs avec résolution explicite des champs Nom / Prénom
        async function initialiserApplication() {
            try {
                statusEl.innerHTML = "<span class='success'>Connecté à Grist ! Chargement des joueurs...</span>";

                const rawJoueurs = await grist.docApi.fetchTable('Joueurs');
                listeJoueursComprete = [];

                if (Array.isArray(rawJoueurs)) {
                    listeJoueursComprete = rawJoueurs;
                } else if (rawJoueurs && typeof rawJoueurs === 'object' && rawJoueurs.id) {
                    const ids = rawJoueurs.id || [];
                    const keys = Object.keys(rawJoueurs);
                    for (let i = 0; i < ids.length; i++) {
                        let item = {};
                        keys.forEach(k => {
                            item[k] = rawJoueurs[k] ? rawJoueurs[k][i] : null;
                        });
                        listeJoueursComprete.push(item);
                    }
                }

                selectJoueur.innerHTML = '<option value="">-- Choisir un joueur dans la liste --</option>';
                
                listeJoueursComprete.forEach(j => {
                    let nomAffiche = "";

                    // Extraction dynamique de la valeur textuelle
                    const extraireTexte = (val) => {
                        if (!val) return "";
                        if (typeof val === 'string') return val.trim();
                        if (Array.isArray(val)) return val.filter(x => x !== 'L').join(' ').trim();
                        return String(val).trim();
                    };

                    // Recherche des clés correspondant au nom / prénom
                    let nomVal = "";
                    let prenomVal = "";

                    for (let key in j) {
                        const kLower = key.toLowerCase();
                        if (kLower === 'nom' || kLower.includes('nom_') || kLower.includes('nomjoueur')) {
                            nomVal = extraireTexte(j[key]);
                        }
                        if (kLower.includes('prenom') || kLower.includes('prénom')) {
                            prenomVal = extraireTexte(j[key]);
                        }
                    }

                    if (nomVal || prenomVal) {
                        nomAffiche = `${nomVal} ${prenomVal}`.trim();
                    } else {
                        // Parcours de secours : trouver la première chaîne non vide qui n'est pas un ID
                        for (let key in j) {
                            if (key !== 'id' && !key.startsWith('grist')) {
                                let valTxt = extraireTexte(j[key]);
                                if (valTxt && !valTxt.startsWith('L,')) {
                                    nomAffiche = valTxt;
                                    break;
                                }
                            }
                        }
                    }

                    j._nomResolver = nomAffiche || ("Joueur #" + j.id);
                });

                // Tri alphabétique des joueurs
                listeJoueursComprete.sort((a, b) => a._nomResolver.localeCompare(b._nomResolver));

                listeJoueursComprete.forEach(j => {
                    const opt = document.createElement('option');
                    opt.value = j.id;
                    opt.text = j._nomResolver;
                    selectJoueur.appendChild(opt);
                });

                statusEl.style.display = 'none';
                appContainer.style.display = 'block';

            } catch (err) {
                afficherErreur("Impossible de charger la table Joueurs : " + err.message);
            }
        }
